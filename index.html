<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta 
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>HTML Practice</title>
    <link rel="stylesheet" href="style.css" type="text/css" />
    <script defer src="script.js" type="text/javascript"></script>
  </head>
  <body>
    <header>
      <h1>Practice <span class="title-style">HTML</span></h1>
    </header>
    <main>
      <article>
        <h2>Dark Mode Toggle</h2>
        <p> Press the button to toggle dark mode!</p>
        <button id="dark-mode-button" type"button">Click Me</button>
      </article>

      <article>
        <h2>Curve Test!</h2>
        <p>Drag the slider to move point on line.</p>
        <svg 
          viewbox="0 0 100 50"
          xmlns="http://www.w3.org/2000/svg"
          height="10rem"
        >
          <path id="path-1" d="M25,40, q25,-50 50,0" />
          <circle id="circle-1" r="5" cx="25" cy="40" />
        </svg>
        <input 
          id="slider-line-1"
          type="range"
          min="0"
          max="100"
          value="0"
        />
      </article>

      <article>
        <h2>Primality Check</h2>
        <output id="prime-result">Enter integer</output>
        <input id="prime-input" type="number" value="0" />
        <button id="prime-button">Check</button>
      </article>

      <article>
        <h2>Stopwatch!</h2>
        <output id="stopwatch-timer">Press start to start timer</output>
        <button id="stopwatch-button">Start</button>
      </article>

      <article id="xkcd-article">
        <h2>xkcd</h2>
        <img
          src="https://imgs.xkcd.com/comics/toothpaste.png"
          title="9 out of 10 dentists have banned me from their offices."
          alt="Toothpaste"
          height="272"
          width="515"
        />
      </article>
    </main>
    <footer>
      <small>© 2026 lokamaster</small>
    </footer>
  </body>
</html>
